AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Container service (Tudovu). ECS Fargate behind an internet-facing
  Application Load Balancer (HTTP). Image from ECR. No custom domain — served on
  the ALB DNS name. Add a domain via the Website path for HTTPS + Route53.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to run the service + load balancer in.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more public subnets for the ALB and Fargate tasks.
  ImageUri:
    Type: String
    Description: ECR image URI the CI/CD workflow pushes.
  DesiredCount:
    Type: Number
    Default: 2
  EnvPostgresServer:
    Type: String
    Default: ""
    Description: POSTGRES_SERVER for the app container.
  EnvFirstSuperuser:
    Type: String
    Default: ""
    Description: FIRST_SUPERUSER for the app container.
  EnvSmtpHost:
    Type: String
    Default: ""
    Description: SMTP_HOST for the app container.
  EnvSmtpPort:
    Type: String
    Default: ""
    Description: SMTP_PORT for the app container.
  EnvSmtpUser:
    Type: String
    Default: ""
    Description: SMTP_USER for the app container.
  EnvSmtpTls:
    Type: String
    Default: ""
    Description: SMTP_TLS for the app container.
  EnvSmtpSsl:
    Type: String
    Default: ""
    Description: SMTP_SSL for the app container.
  EnvEmailsFromEmail:
    Type: String
    Default: ""
    Description: EMAILS_FROM_EMAIL for the app container.
  EnvEmailsFromName:
    Type: String
    Default: ""
    Description: EMAILS_FROM_NAME for the app container.
  EnvBackendCorsOrigins:
    Type: String
    Default: ""
    Description: BACKEND_CORS_ORIGINS for the app container.
  EnvProjectName:
    Type: String
    Default: ""
    Description: PROJECT_NAME for the app container.
  EnvEnvironment:
    Type: String
    Default: ""
    Description: ENVIRONMENT for the app container.
  EnvDomain:
    Type: String
    Default: ""
    Description: DOMAIN for the app container.
  EnvViteApiUrl:
    Type: String
    Default: ""
    Description: VITE_API_URL for the app container.

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress (HTTP 80) from the internet.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Tasks accept traffic only from the ALB.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200-399

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/tudovu/${AWS::StackName}"
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/TudovuArchitectBoundary'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecret
                  - !Ref SecretSecretKey
                  - !Ref SecretFirstSuperuserPassword
                  - !Ref SecretSmtpPassword
                  - !Ref SecretSentryDsn

  SecretSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "SECRET_KEY for ${AWS::StackName}"
      GenerateSecretString:
        PasswordLength: 50
        ExcludePunctuation: true

  SecretFirstSuperuserPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "FIRST_SUPERUSER_PASSWORD for ${AWS::StackName}"
      GenerateSecretString:
        PasswordLength: 50
        ExcludePunctuation: true

  SecretSmtpPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "SMTP_PASSWORD for ${AWS::StackName}"
      GenerateSecretString:
        PasswordLength: 50
        ExcludePunctuation: true

  SecretSentryDsn:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "SENTRY_DSN for ${AWS::StackName}"
      GenerateSecretString:
        PasswordLength: 50
        ExcludePunctuation: true

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/TudovuArchitectBoundary'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt AppBucket.Arn
                  - !Sub "${AppBucket.Arn}/*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !Ref TaskExecutionRole
      TaskRoleArn: !Ref TaskRole
      ContainerDefinitions:
        - Name: app
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 3000
          Essential: true
          Environment:
            - Name: POSTGRES_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: POSTGRES_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: POSTGRES_DB
              Value: "appdb"
            - Name: POSTGRES_USER
              Value: "appuser"
            - Name: POSTGRES_SERVER
              Value: !Ref EnvPostgresServer
            - Name: FIRST_SUPERUSER
              Value: !Ref EnvFirstSuperuser
            - Name: SMTP_HOST
              Value: !Ref EnvSmtpHost
            - Name: SMTP_PORT
              Value: !Ref EnvSmtpPort
            - Name: SMTP_USER
              Value: !Ref EnvSmtpUser
            - Name: SMTP_TLS
              Value: !Ref EnvSmtpTls
            - Name: SMTP_SSL
              Value: !Ref EnvSmtpSsl
            - Name: EMAILS_FROM_EMAIL
              Value: !Ref EnvEmailsFromEmail
            - Name: EMAILS_FROM_NAME
              Value: !Ref EnvEmailsFromName
            - Name: BACKEND_CORS_ORIGINS
              Value: !Ref EnvBackendCorsOrigins
            - Name: PROJECT_NAME
              Value: !Ref EnvProjectName
            - Name: ENVIRONMENT
              Value: !Ref EnvEnvironment
            - Name: DOMAIN
              Value: !Ref EnvDomain
            - Name: VITE_API_URL
              Value: !Ref EnvViteApiUrl
            - Name: APP_BUCKET
              Value: !Ref AppBucket
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "${DbSecret}:password::"
            - Name: SECRET_KEY
              ValueFrom: !Ref SecretSecretKey
            - Name: FIRST_SUPERUSER_PASSWORD
              ValueFrom: !Ref SecretFirstSuperuserPassword
            - Name: SMTP_PASSWORD
              ValueFrom: !Ref SecretSmtpPassword
            - Name: SENTRY_DSN
              ValueFrom: !Ref SecretSentryDsn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref ServiceSecurityGroup
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "DB credentials for ${AWS::StackName}"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"appuser"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "Subnets for ${AWS::StackName} database"
      SubnetIds: !Ref PublicSubnetIds

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database accepts traffic only from the app tasks.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: "20"
      DBName: appdb
      MasterUsername: appuser
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false
      StorageEncrypted: false
      BackupRetentionPeriod: 1

  AppBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all

Outputs:
  AppUrl:
    Description: App URL (ALB DNS). Add a custom domain via the Website path for HTTPS.
    Value: !Sub "http://${LoadBalancer.DNSName}"
  CdnUrl:
    Description: HTTPS URL served by CloudFront (edge TLS, no custom domain needed).
    Value: !Sub "https://${Distribution.DomainName}"
  DatabaseEndpoint:
    Description: RDS endpoint the app connects to.
    Value: !GetAtt Database.Endpoint.Address
